# Slack Mimic configuration.
#
# Only channels listed here are mirrored — this is an explicit allowlist so
# private channels / DMs are never mirrored by accident.
#
# Channel ids (the "C..." segment), NOT names. Find an HS channel id by opening
# the channel in the browser and reading it from the URL.

db_path: slackmimic.sqlite3

# How often to poll each channel when the websocket transport is unavailable.
poll_interval_seconds: 5

# Prefer the realtime websocket; fall back to polling automatically if it fails.
use_websocket: true
# After the websocket fails, poll for this many seconds, then try it again.
websocket_retry_seconds: 300

# Catch-up polls (startup, reconnect) look this many days back for threads with
# new replies, so replies to older threads aren't missed while disconnected.
thread_lookback_days: 7
# In polling mode, how often (seconds) to run that thread rescan.
thread_rescan_seconds: 300

# On a channel's first run, mirror this many days of history before going live.
# 0 = start from now (only new messages). Restarts never re-backfill.
backfill_days: 0

# Reverse relay: let the owner send approved replies back into HeartStamp from
# vanta-core (requires Socket Mode + TARGET_APP_TOKEN + read/im:write scopes).
reverse_enabled: false
# Owner's member id in the TARGET workspace; they approve every relayed
# message (all human members' messages are eligible).
owner_member_id: ""

channels:
  - source: C0123ABCD   # HS #general
    target: C0456WXYZ   # your #hs-general
    label: general
  # - source: C0789EFGH
  #   target: C0987TUVW
  #   label: announcements
